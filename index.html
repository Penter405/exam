<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>刷題系統</title>
    <link rel="stylesheet" href="docs/style.css">
</head>
<body>
    <div class="container" id="app-container">
        <!-- ⚙️ Settings button: 白色容器右上角 -->
        <button type="button" class="container-topright-btn" id="settings-btn" onclick="toggleSettings()">⚙️</button>

        <h1>刷題系統</h1>
        
        <div class="exam-selector">
            <h2>選擇考試類型</h2>
            <button onclick="selectExam('1')">乙檢</button>
            <button onclick="selectExam('2')">丙檢</button>
        </div>
        
        <div id="main-menu" class="hidden">
            <h2>主選單</h2>
            <button onclick="startNewQuiz()">新開始</button>
            <button onclick="continueQuiz()">接續之前題目</button>
            <button onclick="searchQuestions()">查詢題目</button>
            <button onclick="searchAnswers()">依題目查詢答案</button>
            <button onclick="fixWrongQuestions()">訂正錯題</button>
            <button onclick="initializeData()">初始化資料</button>
            <button onclick="uploadProcessedData()">上傳已處理資料</button>
            <button onclick="downloadData()">下載資料檔案</button>
            <hr>
            <button onclick="backToExamSelect()">返回選擇考試</button>
            <div class="cache-indicator" id="cache-indicator"></div>
        </div>
        
        <div id="quiz-area" class="hidden">
            <div id="question-display"></div>
            
            <!-- Answer input (readonly, no virtual keyboard) -->
            <input type="text" id="answer-input" placeholder="已選擇的答案" readonly inputmode="none">
            
            <!-- Number pad row: 0 1 2 3 4 -->
            <div class="numpad-row" id="numpad-row">
                <button type="button" class="numpad-btn num-0" data-num="0" onclick="toggleNumpad(0)">0</button>
                <button type="button" class="numpad-btn num-other" data-num="1" onclick="toggleNumpad(1)">1</button>
                <button type="button" class="numpad-btn num-other" data-num="2" onclick="toggleNumpad(2)">2</button>
                <button type="button" class="numpad-btn num-other" data-num="3" onclick="toggleNumpad(3)">3</button>
                <button type="button" class="numpad-btn num-other" data-num="4" onclick="toggleNumpad(4)">4</button>
            </div>
            
            <!-- Action buttons -->
            <div class="action-row">
                <button onclick="submitAnswer()">提交答案</button>
                <button onclick="stopQuiz()">停止</button>
            </div>
        </div>
        
        <div id="search-area" class="hidden">
            <h2>查詢題目</h2>
            <input type="text" id="search-input" placeholder="輸入題目有的字(不包含選項的字)">
            <button onclick="performSearch()">搜尋</button>
            <button onclick="backToMenu()">返回主選單</button>
            <div id="search-results"></div>
        </div>
        
        <div id="answer-lookup-area" class="hidden">
            <h2>依題目查詢答案</h2>
            <input type="text" id="answer-num-input" placeholder="請輸入題號 (輸入0停止)">
            <button onclick="lookupAnswer()">查詢</button>
            <button onclick="backToMenu()">返回主選單</button>
            <div id="answer-display"></div>
        </div>
        
        <div id="fix-area" class="hidden">
            <h2>訂正錯題</h2>
            <div id="fix-question-display"></div>
            <textarea id="fix-note-input" placeholder="請寫下訂正 (輸入stop停止)" rows="3"></textarea>
            <button onclick="submitFix()">提交訂正</button>
            <button onclick="submitFix()">停止訂正</button>
        </div>
        
        <!-- 白色容器底部 (output area) — 拖拉線 + 答題記錄 都在這裡 -->
        <div id="output">
            <div id="output-text"></div>
            <!-- 拖拉線: middle top -->
            <div class="last-q-handle" id="last-q-handle" ontouchstart="onHandleTouchStart(event)" ontouchmove="onHandleTouchMove(event)" ontouchend="onHandleTouchEnd(event)" onclick="toggleLastQuestion()">
                <div class="last-q-handle-bar"></div>
                <div class="last-q-handle-label">上題記錄</div>
            </div>

            <!-- 可展開區域: 上題結果 -->
            <div id="collapsible-area" class="hidden">
                <div id="last-question-content">
                    <p style="text-align:center;color:#999;">尚無上題記錄</p>
                </div>
            </div>

            <!-- 答題記錄按鈕: 右下角 -->
            <button type="button" class="bottom-right-btn" id="history-toggle-btn" onclick="toggleLastQuestion()">📋</button>
        </div>
    </div>

    <!-- ===== SETTINGS POPUP ===== -->
    <div id="settings-popup">
        <div class="settings-title">⚙️ 設定</div>
        
        <div class="settings-item" onclick="openSpacingSlider()">
            <span class="settings-item-label">調整間距</span>
            <span class="settings-item-action">▶</span>
        </div>
        
        <div class="settings-item" onclick="toggleHideNumpad()">
            <span class="settings-item-label">隱藏 01234 按鈕</span>
            <div class="toggle-switch" id="toggle-hide-numpad"></div>
        </div>
        
        <div class="settings-item" onclick="toggleSuperClear()">
            <span class="settings-item-label">極簡模式</span>
            <div class="toggle-switch" id="toggle-super-clear"></div>
        </div>
        
        <div class="settings-item" onclick="showDataManagement()">
            <span class="settings-item-label">資料管理</span>
            <span class="settings-item-action">▶</span>
        </div>
        
        <div class="data-info" id="data-info"></div>
    </div>

    <!-- ===== SPACING SLIDER OVERLAY ===== -->
    <div id="spacing-overlay">
        <div class="spacing-label">調整間距 (縮小間距，文字大小不變)</div>
        <input type="range" id="spacing-slider" min="0.3" max="1.5" step="0.05" value="1">
        <button class="spacing-close-btn" onclick="closeSpacingSlider()">完成</button>
    </div>

    <script src="docs/script.js"></script>
    <script src="docs/ui.js"></script>
</body>
</html>
